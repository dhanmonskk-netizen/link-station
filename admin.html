<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Station Admin</title>
<style>
body{font-family:Arial;background:#10172a;color:white;padding:20px}
main{max-width:420px;margin:auto}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:0;border-radius:8px}
button{background:#477bff;color:white;font-weight:bold}
.box{background:#1c2740;padding:18px;border-radius:12px}
</style>
</head>
<body>
<main>
<div class="box" id="login">
<h2>🔐 Admin Login</h2>
<input id="password" type="password" placeholder="Admin Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
<div class="box" id="panel" hidden>
<h2>My Link Station Admin</h2>
<input id="name" placeholder="লিংকের নাম">
<input id="url" placeholder="https://example.com">
<button onclick="addLink()">লিংক যোগ করুন</button>
<div id="links"></div>
<button onclick="logout()">Logout</button>
</div>
</main>
<script>
const ADMIN_PASSWORD = "CHANGE_THIS_PASSWORD";
let links=[];
function login(){
if(document.getElementById('password').value===ADMIN_PASSWORD){
document.getElementById('login').hidden=true;
document.getElementById('panel').hidden=false;
}else{
document.getElementById('msg').textContent='পাসওয়ার্ড সঠিক নয়।';
}
}
function logout(){
document.getElementById('panel').hidden=true;
document.getElementById('login').hidden=false;
document.getElementById('password').value='';
}
function addLink(){
const name=document.getElementById('name').value.trim();
const url=document.getElementById('url').value.trim();
try{
const parsed=new URL(url);
if(!name||!['http:','https:'].includes(parsed.protocol))throw Error();
links.push({name,url});
showLinks();
document.getElementById('name').value='';
document.getElementById('url').value='';
}catch(e){alert('লিংকের নাম ও সঠিক ঠিকানা দিন।')}
}
function showLinks(){
const box=document.getElementById('links');
box.replaceChildren();
links.forEach((link,i)=>{
const row=document.createElement('div');
row.textContent=link.name+' — '+link.url;
const del=document.createElement('button');
del.textContent='মুছুন';
del.onclick=()=>{links.splice(i,1);showLinks()};
row.appendChild(del);
box.appendChild(row);
});
}
</script>
</body>
</html>
