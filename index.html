too<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Station</title>
<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #10172a, #263b65);
  color: white;
  min-height: 100vh;
  box-sizing: border-box;
}
.container {
  max-width: 480px;
  margin: 35px auto;
  text-align: center;
}
h1 { font-size: 32px; }
p { color: #d5def4; }
.card {
  display: block;
  background: white;
  color: #18233d;
  padding: 17px;
  margin: 14px 0;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
}
.card:active { opacity: 0.8; }
.note { font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<div class="container">
<h1>🔗 Link Station</h1>
<p>All my important links in one place</p><a class="card" href="https://example.com" target="_blank">🌐 My First Link</a>

<a class="card" href="https://google.com" target="_blank">🔎 Google</a>

<a class="card" href="https://youtube.com" target="_blank">▶️ YouTube</a>

<p class="note">Welcome to my Link Station</p>
</div>
</body>
</html>
